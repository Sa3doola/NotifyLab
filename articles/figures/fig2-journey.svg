<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="826" viewBox="-20 -20 1060 826" role="img" aria-label="Sequence diagram. Register phase on every launch: the app asks permission, registers, iOS gets an APNs device token, the app hands it to the FCM SDK, receives an FCM token and uploads both to your server, which stores them. Send phase on every event: your server sends through FCM HTTP v1, FCM calls APNs with a JWT, or your server calls APNs directly; APNs delivers to iOS, iOS runs the Service Extension, decides whether to show it based on permission, Focus and interruption level, and a tap routes back into the app."><style>
text{font-family:-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif}
.sv-zone{fill:#E8ECF1}.sv-box{fill:#fff;stroke:#D3DAE3;stroke-width:1.25}
.sv-acc{fill:#FBE6E3;stroke:#D4382C;stroke-width:1.5}.sv-bad{fill:#FBE6E3;stroke:#C3362B;stroke-width:1.5;stroke-dasharray:6 4}
.sv-note{fill:#fff;stroke:#566172;stroke-width:1;stroke-dasharray:3 3}
.ln-app{stroke:#2C62CC;stroke-width:2}.ln-ios{stroke:#5B6778;stroke-width:2}.ln-apns{stroke:#6A4CC4;stroke-width:2}.ln-fcm{stroke:#B27708;stroke-width:2}.ln-server{stroke:#16806A;stroke-width:2}
.sv-t{font-size:13.5px;font-weight:600;fill:#131A24}.sv-s{font-size:12.5px;fill:#566172}.sv-i{font-size:12.5px;fill:#131A24}
.sv-m{font-family:Menlo,monospace;font-size:11.5px;fill:#566172}.sv-mt{font-family:Menlo,monospace;font-size:12px;fill:#131A24}
.sv-cap{font-family:Menlo,monospace;font-size:11px;letter-spacing:.1em;fill:#566172;font-weight:500}
.sv-line{stroke:#566172;stroke-width:1.5;fill:none}.sv-line.acc{stroke:#D4382C}.sv-line.bad{stroke:#C3362B}.dash{stroke-dasharray:6 5}
.sv-life{stroke:#D3DAE3;stroke-width:1.5;stroke-dasharray:3 6}.sv-rule{stroke:#D3DAE3;stroke-width:1}
.sv-lbl{font-size:12.5px;fill:#131A24;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}.sv-lbl.z{stroke:#E8ECF1}.sv-lbl.m{font-family:Menlo,monospace;font-size:11.5px}
.sv-step{fill:#D4382C}.sv-step-t{font-family:Menlo,monospace;font-size:10.5px;font-weight:600;fill:#fff}
.f-muted{fill:#566172}.f-acc{fill:#D4382C}.f-bad{fill:#C3362B}
</style><rect x="-20" y="-20" width="1060" height="826" fill="#fff"/>
      <defs>
        <marker id="f2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-muted"/></marker>
      </defs>
      <rect class="sv-box ln-app" x="38" y="12" width="144" height="38" rx="9"/><text class="sv-t" x="110" y="36" text-anchor="middle">NotifyLab app</text>
      <rect class="sv-box ln-ios" x="238" y="12" width="144" height="38" rx="9"/><text class="sv-t" x="310" y="36" text-anchor="middle">iOS</text>
      <rect class="sv-box ln-apns" x="438" y="12" width="144" height="38" rx="9"/><text class="sv-t" x="510" y="36" text-anchor="middle">APNs</text>
      <rect class="sv-box ln-fcm" x="638" y="12" width="144" height="38" rx="9"/><text class="sv-t" x="710" y="36" text-anchor="middle">FCM</text>
      <rect class="sv-box ln-server" x="838" y="12" width="144" height="38" rx="9"/><text class="sv-t" x="910" y="36" text-anchor="middle">Your server</text>

      <line class="sv-life" x1="110" y1="50" x2="110" y2="770"/>
      <line class="sv-life" x1="310" y1="50" x2="310" y2="770"/>
      <line class="sv-life" x1="510" y1="50" x2="510" y2="770"/>
      <line class="sv-life" x1="710" y1="50" x2="710" y2="770"/>
      <line class="sv-life" x1="910" y1="50" x2="910" y2="770"/>

      <line class="sv-rule" x1="44" y1="72" x2="44" y2="400"/>
      <text class="sv-cap" x="28" y="236" text-anchor="middle" transform="rotate(-90 28 236)">REGISTER · EVERY LAUNCH</text>
      <line class="sv-rule dash" x1="44" y1="416" x2="1008" y2="416"/>
      <line class="sv-rule" x1="44" y1="432" x2="44" y2="766"/>
      <text class="sv-cap" x="28" y="600" text-anchor="middle" transform="rotate(-90 28 600)">SEND · EVERY EVENT</text>

      <!-- 1 -->
      <line class="sv-line" x1="121" y1="96" x2="308" y2="96" marker-end="url(#f2a)"/>
      <circle class="sv-step" cx="110" cy="96" r="9"/><text class="sv-step-t" x="110" y="99.5" text-anchor="middle">1</text>
      <text class="sv-lbl" x="212" y="88" text-anchor="middle">ask permission</text>
      <!-- 2 -->
      <line class="sv-line" x1="121" y1="136" x2="308" y2="136" marker-end="url(#f2a)"/>
      <circle class="sv-step" cx="110" cy="136" r="9"/><text class="sv-step-t" x="110" y="139.5" text-anchor="middle">2</text>
      <text class="sv-lbl" x="212" y="128" text-anchor="middle">register for push</text>
      <!-- 3 -->
      <line class="sv-line" x1="321" y1="176" x2="508" y2="176" marker-end="url(#f2a)"/>
      <circle class="sv-step" cx="310" cy="176" r="9"/><text class="sv-step-t" x="310" y="179.5" text-anchor="middle">3</text>
      <text class="sv-lbl" x="412" y="168" text-anchor="middle">connect &amp; register</text>
      <!-- 4 -->
      <line class="sv-line" x1="499" y1="216" x2="112" y2="216" marker-end="url(#f2a)"/>
      <circle class="sv-step" cx="510" cy="216" r="9"/><text class="sv-step-t" x="510" y="219.5" text-anchor="middle">4</text>
      <text class="sv-lbl" x="212" y="208" text-anchor="middle">APNs device token</text>
      <!-- 5 -->
      <line class="sv-line" x1="121" y1="256" x2="708" y2="256" marker-end="url(#f2a)"/>
      <circle class="sv-step" cx="110" cy="256" r="9"/><text class="sv-step-t" x="110" y="259.5" text-anchor="middle">5</text>
      <text class="sv-lbl" x="412" y="248" text-anchor="middle">hand APNs token to the FCM SDK</text>
      <!-- 6 -->
      <line class="sv-line" x1="699" y1="296" x2="112" y2="296" marker-end="url(#f2a)"/>
      <circle class="sv-step" cx="710" cy="296" r="9"/><text class="sv-step-t" x="710" y="299.5" text-anchor="middle">6</text>
      <text class="sv-lbl" x="412" y="288" text-anchor="middle">FCM registration token</text>
      <!-- 7 -->
      <line class="sv-line" x1="121" y1="336" x2="908" y2="336" marker-end="url(#f2a)"/>
      <circle class="sv-step" cx="110" cy="336" r="9"/><text class="sv-step-t" x="110" y="339.5" text-anchor="middle">7</text>
      <text class="sv-lbl m" x="610" y="328" text-anchor="middle">POST /devices { fcmToken, apnsToken, env }</text>
      <!-- 8 -->
      <rect class="sv-note" x="830" y="364" width="160" height="32" rx="7"/>
      <text class="sv-i" x="910" y="384.5" text-anchor="middle">save token + lastSeenAt</text>
      <circle class="sv-step" cx="816" cy="380" r="9"/><text class="sv-step-t" x="816" y="383.5" text-anchor="middle">8</text>

      <!-- 9 -->
      <rect class="sv-note" x="820" y="440" width="180" height="32" rx="7"/>
      <text class="sv-i" x="910" y="460.5" text-anchor="middle">event: order #1042 shipped</text>
      <circle class="sv-step" cx="806" cy="456" r="9"/><text class="sv-step-t" x="806" y="459.5" text-anchor="middle">9</text>
      <!-- 10 -->
      <line class="sv-line" x1="899" y1="500" x2="712" y2="500" marker-end="url(#f2a)"/>
      <circle class="sv-step" cx="910" cy="500" r="9"/><text class="sv-step-t" x="910" y="503.5" text-anchor="middle">10</text>
      <text class="sv-lbl" x="810" y="492" text-anchor="middle">HTTP v1 send · OAuth2</text>
      <!-- 11 -->
      <line class="sv-line" x1="699" y1="540" x2="512" y2="540" marker-end="url(#f2a)"/>
      <circle class="sv-step" cx="710" cy="540" r="9"/><text class="sv-step-t" x="710" y="543.5" text-anchor="middle">11</text>
      <text class="sv-lbl" x="610" y="532" text-anchor="middle">HTTP/2 · JWT from .p8</text>
      <!-- alt -->
      <line class="sv-line dash" x1="906" y1="580" x2="512" y2="580" marker-end="url(#f2a)"/>
      <text class="sv-lbl" x="710" y="572" text-anchor="middle">or skip FCM: call APNs directly</text>
      <!-- 12 -->
      <line class="sv-line" x1="499" y1="620" x2="312" y2="620" marker-end="url(#f2a)"/>
      <circle class="sv-step" cx="510" cy="620" r="9"/><text class="sv-step-t" x="510" y="623.5" text-anchor="middle">12</text>
      <text class="sv-lbl" x="410" y="612" text-anchor="middle">deliver · stored if offline</text>
      <!-- 13 -->
      <line class="sv-line" x1="299" y1="660" x2="112" y2="660" marker-end="url(#f2a)"/>
      <circle class="sv-step" cx="310" cy="660" r="9"/><text class="sv-step-t" x="310" y="663.5" text-anchor="middle">13</text>
      <text class="sv-lbl" x="210" y="652" text-anchor="middle">run Service Extension</text>
      <!-- 14 -->
      <rect class="sv-note" x="196" y="684" width="228" height="32" rx="7"/>
      <text class="sv-i" x="310" y="704.5" text-anchor="middle">show? permission · Focus · level</text>
      <circle class="sv-step" cx="182" cy="700" r="9"/><text class="sv-step-t" x="182" y="703.5" text-anchor="middle">14</text>
      <!-- 15 -->
      <line class="sv-line" x1="299" y1="746" x2="112" y2="746" marker-end="url(#f2a)"/>
      <circle class="sv-step" cx="310" cy="746" r="9"/><text class="sv-step-t" x="310" y="749.5" text-anchor="middle">15</text>
      <text class="sv-lbl" x="210" y="738" text-anchor="middle">tap → deep link</text>
    </svg>